# Recopie sur ghcr.io les images utilisées par le cours Kubernetes, en amd64 + arm64.
# Docker Hub s'est révélé très lent (80 Mo en ~4 min) : tout le cours tire ses images depuis ghcr.io/bngams.
# Le label "source" relie chaque image à ce dépôt public : elle devient publique automatiquement.
name: mirror-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mirror/**", ".github/workflows/mirror-images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { from: "dockersamples/examplevotingapp_worker:latest", to: "kube-worker:1.0" }
          - { from: "dockersamples/examplevotingapp_result:latest", to: "kube-result:1.0" }
          - { from: "redis:8-alpine", to: "kube-redis:8-alpine" }
          - { from: "postgres:15-alpine", to: "kube-postgres:15-alpine" }
          - { from: "busybox:1.37", to: "kube-busybox:1.37" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./mirror
          platforms: linux/amd64,linux/arm64
          build-args: BASE=${{ matrix.from }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.to }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
