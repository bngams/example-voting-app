# Fork pédagogique : construit result avec ses libellés configurables (OPTION_A / OPTION_B).
# Publie ghcr.io/bngams/kube-result:1.1 (amd64 + arm64). La version 1.0 (copie à l'identique) reste utilisée par les TP.
name: result-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["result/**", ".github/workflows/result-images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./result
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/kube-result:1.1
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
