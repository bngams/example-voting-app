# Fork pédagogique (cours Kubernetes) : construit les 3 versions du service vote.
# et les publie sur ghcr.io/bngams/kube-vote:{1.0,2.0,3.0}, en amd64 + arm64.
# Après le premier push : rendre le paquet PUBLIC (GitHub > Packages > kube-vote > Package settings).
name: vote-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["vote/**", ".github/workflows/vote-images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["1.0", "2.0", "3.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./vote
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ matrix.version }}
          tags: ghcr.io/${{ github.repository_owner }}/kube-vote:${{ matrix.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
